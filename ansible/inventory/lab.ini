# Ansible runs on the control VM and reaches the others over the host-only network.
[controller]
control ansible_connection=local ansible_host=192.168.56.10

[k3s_server]
k8s-1 ansible_host=192.168.56.11

[k3s_agent]
k8s-2 ansible_host=192.168.56.12

[k3s_cluster:children]
k3s_server
k3s_agent

[lab:children]
controller
k3s_cluster
