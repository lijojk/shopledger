---
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set the timezone
  community.general.timezone:
    name: "{{ lab_timezone }}"

- name: Let every VM find the others by name
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED LAB HOSTS"
    block: |
      {% for host in groups['lab'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - htop
      - jq
      - sysstat
      - ufw
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow SSH keys only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Install the health check script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/vm-health.sh"
    dest: /usr/local/bin/vm-health.sh
    mode: "0755"

- name: Install the health check units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - vm-health.service
    - vm-health.timer
  notify: Reload systemd

- name: Flush handlers before starting the timer
  ansible.builtin.meta: flush_handlers

- name: Start the health check timer
  ansible.builtin.systemd_service:
    name: vm-health.timer
    enabled: true
    state: started

- name: Turn swap off on Kubernetes nodes
  ansible.builtin.command: swapoff -a
  when:
    - "'k3s_cluster' in group_names"
    - ansible_swaptotal_mb > 0
  changed_when: true

- name: Keep swap off after a reboot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+\S+\s+swap\s'
    state: absent
  when: "'k3s_cluster' in group_names"

- name: Firewall the control VM
  when: inventory_hostname in groups['controller']
  block:
    - name: Allow SSH and Jenkins from the lab network only
      community.general.ufw:
        rule: allow
        src: "{{ lab_network }}"
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "8080"
    - name: Deny everything else inbound and turn the firewall on
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
