---
- name: Install Java first, as the Jenkins docs require
  ansible.builtin.apt:
    name:
      - fontconfig
      - openjdk-21-jre-headless
    state: present

- name: Add the Jenkins signing key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: "0644"

- name: Add the Jenkins LTS repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/
    filename: jenkins
    state: present

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

- name: Let Jenkins run Docker builds
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart jenkins

- name: Create the service override folder
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: "0755"

- name: Cap the Jenkins heap for a small VM
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    content: |
      [Service]
      Environment="JAVA_OPTS=-Djava.awt.headless=true -Xmx1024m"
    mode: "0644"
  notify: Restart jenkins

- name: Start Jenkins at boot
  ansible.builtin.service:
    name: jenkins
    enabled: true
    state: started
