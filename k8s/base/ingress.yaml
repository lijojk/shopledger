# /metrics and /readyz are left out on purpose: they stay inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopledger
spec:
  ingressClassName: traefik
  rules:
    - host: replaced-by-overlay.shopledger.lab
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shopledger
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: shopledger
                port:
                  name: http
          - path: /version
            pathType: Exact
            backend:
              service:
                name: shopledger
                port:
                  name: http
          - path: /
            pathType: Exact
            backend:
              service:
                name: shopledger
                port:
                  name: http
