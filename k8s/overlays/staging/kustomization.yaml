apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: shopledger-config
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=INFO
images:
  - name: shopledger
    newName: replaced-by-deploy-script
    newTag: replaced-by-deploy-script
patches:
  - target:
      kind: Ingress
      name: shopledger
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.shopledger.lab
