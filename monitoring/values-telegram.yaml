# Optional. Sends critical alerts to Telegram.
# 1. Create the secret (see the guide).  2. Put your numeric chat id below.
# 3. Run: scripts/install-monitoring.sh --values monitoring/values-telegram.yaml
alertmanager:
  alertmanagerSpec:
    secrets:
      - telegram-bot
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        - matchers:
            - severity = "critical"
          receiver: telegram
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot/token
            chat_id: 123456789
            parse_mode: HTML
            send_resolved: true
